name: CI

env:
   HUSKY: 0

on:
   push:
      branches: [main]
   pull_request:

permissions:
   contents: read

concurrency:
   group: ci-${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

jobs:
   check:
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - name: Check out repository
           uses: actions/checkout@v7

         - name: Set up pnpm
           uses: pnpm/action-setup@v6
           with:
              version: 10.12.1

         - name: Set up Node.js
           uses: actions/setup-node@v7
           with:
              node-version: 24
              cache: pnpm

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         - name: Build and test
           run: pnpm run check

         - name: Verify package tarball
           run: pnpm --config.ignore-scripts=true pack --pack-destination "$RUNNER_TEMP/session-kit-pack"

   minimum-peers:
      name: check (oldest supported peers)
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - name: Check out repository
           uses: actions/checkout@v7

         - name: Set up pnpm
           uses: pnpm/action-setup@v6
           with:
              version: 10.12.1

         - name: Set up Node.js
           uses: actions/setup-node@v7
           with:
              node-version: 24
              cache: pnpm

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         # Keep these at the lower bounds of peerDependencies in package.json.
         # Type packages are not peers: these are the first releases whose
         # react/jsx-runtime and react-dom/client types resolve under NodeNext.
         # The override stops @types/react-dom pulling in newer React types.
         - name: Install oldest supported peers
           run: |
              npm pkg set 'pnpm.overrides.@types/react=18.0.2'
              pnpm add --save-dev --save-exact \
                react@18.0.0 react-dom@18.0.0 \
                @types/react@18.0.2 @types/react-dom@18.0.3 \
                @tanstack/react-router@1.127.0 react-router@7.0.0

         - name: Build and test
           run: pnpm run build && pnpm test && pnpm run test:types
