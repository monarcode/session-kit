name: CI

env:
   HUSKY: 0

on:
   push:
      branches: [main]
   pull_request:

permissions:
   contents: read

concurrency:
   group: ci-${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

jobs:
   check:
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - name: Check out repository
           uses: actions/checkout@v7

         - name: Set up pnpm
           uses: pnpm/action-setup@v6
           with:
              version: 10.12.1

         - name: Set up Node.js
           uses: actions/setup-node@v7
           with:
              node-version: 24
              cache: pnpm

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         - name: Build and test
           run: pnpm run check

         - name: Verify package tarball
           run: pnpm --config.ignore-scripts=true pack --pack-destination "$RUNNER_TEMP/session-kit-pack"

   minimum-peers:
      name: check (oldest supported peers)
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - name: Check out repository
           uses: actions/checkout@v7

         - name: Set up pnpm
           uses: pnpm/action-setup@v6
           with:
              version: 10.12.1

         - name: Set up Node.js
           uses: actions/setup-node@v7
           with:
              node-version: 24
              cache: pnpm

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         # Keep these at the lower bounds of peerDependencies in package.json.
         # Type packages are not peers: these are the first releases whose
         # react/jsx-runtime and react-dom/client types resolve under NodeNext.
         # The override stops @types/react-dom pulling in newer React types.
         # Expo peers are SDK 53's. expo-file-system stays at the dev version:
         # SDK 53's has no `exports`, so `expo-file-system/next` resolves only
         # in Metro, not under NodeNext. The `/next` API used is the same.
         - name: Install oldest supported peers
           run: |
              npm pkg set 'pnpm.overrides.@types/react=18.0.2'
              pnpm add --workspace-root --save-dev --save-exact \
                react@18.0.0 react-dom@18.0.0 \
                @types/react@18.0.2 @types/react-dom@18.0.3 \
                @tanstack/react-router@1.132.0 @tanstack/react-start@1.169.0 \
                react-router@7.0.0 next@16.0.0 expo-router@5.0.2 \
                expo-secure-store@14.2.0 react-native@0.79.0 effect@4.1.0 \
                @monarcode/effetch@0.1.0-rc.1

         - name: Build and test
           run: pnpm run build && pnpm test && pnpm run test:types

   examples:
      name: build example apps
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - name: Check out repository
           uses: actions/checkout@v7

         - name: Set up pnpm
           uses: pnpm/action-setup@v6
           with:
              version: 10.12.1

         - name: Set up Node.js
           uses: actions/setup-node@v7
           with:
              node-version: 24
              cache: pnpm

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         # Builds never call DummyJSON; only the running apps do. Pointing it
         # at an unroutable address makes a build that tried fail.
         - name: Block DummyJSON
           run: echo "0.0.0.0 dummyjson.com" | sudo tee -a /etc/hosts

         # Each app builds and type-checks against the package built here. The
         # Expo app is bundled for iOS and Android with `expo export`, offline.
         - name: Build the package and the example apps
           run: pnpm run build:examples
           env:
              EXPO_OFFLINE: 1
              EXPO_NO_TELEMETRY: 1
